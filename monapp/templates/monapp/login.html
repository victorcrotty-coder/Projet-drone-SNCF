<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Connexion</title>
  {% load static %}
</head>
<body>
  <h1>Connexion</h1>

  {% if messages %}
    <ul style="color: red;">
      {% for message in messages %}
        <li>{{ message }}</li>
      {% endfor %}
    </ul>
  {% endif %}

  <form method="post">
    {% csrf_token %}

    <div>
      <label for="id_email">Adresse e-mail</label><br />
      <input id="id_email" name="email" type="email" required autofocus />
    </div>

    <div>
      <label for="id_password">Mot de passe</label><br />
      <input id="id_password" name="password" type="password" required />
    </div>

    <div>
      <button type="submit">Se connecter</button>
    </div>
  </form>
</body>
</html>
